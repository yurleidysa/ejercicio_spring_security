<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 - Acceso denegado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center text-center">

    <script src="/csrf.js"></script>

    <main class="container px-3">

        <p class="display-1 fw-bold mb-0"
           style="font-size: 110px; background: linear-gradient(135deg, #0f5e7e, #1b8ab0); color: transparent; background-clip: text; -webkit-background-clip: text;">
            403
        </p>

        <h1 class="h3 mt-2">No tienes permiso para ver esta página</h1>

        <p class="text-secondary mx-auto my-3" style="max-width: 420px;">
            Tu cuenta no tiene el rol necesario para acceder a este recurso.
            Si crees que es un error, contacta al administrador.
        </p>

        <div class="d-flex flex-wrap gap-3 justify-content-center mt-4">

            <a href="/menu.html" class="btn text-white px-4"
               style="background-color: #0f5e7e;">
                Volver al menú
            </a>

            <form action="/logout" method="post">
                <button type="submit" class="btn btn-outline-primary px-4"
                        style="border-color: #0f5e7e; color: #0f5e7e;">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
