<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center">

    <script src="/csrf.js"></script>

    <div class="card shadow border-0 rounded-4 p-4 m-3 w-100"
         style="max-width: 340px;">

        <h1 class="h3 text-center mb-4" style="color: #0f5e7e;">
            Iniciar sesión
        </h1>

        <form action="/login" method="post">

            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" id="username" name="username"
                       class="form-control" required autofocus>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password"
                       class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2"
                    style="background-color: #0f5e7e; border: none;">
                Entrar
            </button>

        </form>

        <div id="error" class="alert alert-danger text-center mt-3 mb-0 py-2"
             style="display: none;">
            Usuario o contraseña incorrectos.
        </div>

        <div id="salida" class="alert alert-success text-center mt-3 mb-0 py-2"
             style="display: none;">
            Cerraste sesión correctamente.
        </div>

    </div>

    <script>
        const p = new URLSearchParams(location.search);

        if (p.has('error')) {
            document.getElementById('error').style.display = 'block';
        }

        if (p.has('logout')) {
            document.getElementById('salida').style.display = 'block';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
