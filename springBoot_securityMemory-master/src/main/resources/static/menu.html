<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menú</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <script src="/csrf.js"></script>

    <header class="navbar navbar-dark px-4" style="background-color: #0f5e7e;">

        <form action="/logout" method="post">
            <button type="submit" class="btn btn-danger btn-sm">
                Cerrar sesión
            </button>
        </form>
    </header>

    <main class="container">
        <div class="card shadow border-0 rounded-4 mx-auto mt-5 p-4 text-center"
             style="max-width: 480px;">

            <p class="text-secondary">
                Elige una página. Si tu rol no tiene permiso, verás el error 403.
            </p>

            <div class="d-grid gap-3 mt-3"
                 style="grid-template-columns: 1fr 1fr;">

                <a href="/" class="btn btn-primary"
                   style="background-color: #0f5e7e; border: none;">
                    Inicio
                </a>

                <a href="/new" class="btn btn-primary"
                   style="background-color: #0f5e7e; border: none;">
                    Crear
                </a>

                <a href="/edit/1" class="btn btn-primary"
                   style="background-color: #0f5e7e; border: none;">
                    Editar
                </a>

                <a href="/delete/1" class="btn btn-primary"
                   style="background-color: #0f5e7e; border: none;">
                    Eliminar
                </a>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
